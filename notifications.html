<!-- =========================================================
     FLOATING NOTIFICATION TOAST
     File: notifications.html
========================================================= -->
<div class="notification-toast" id="notificationToast" role="status" aria-live="polite">

    <div class="toast-avatar" id="toastAvatar">✓</div>

    <div class="toast-content">
        <p class="toast-title" id="toastTitle">New PPC Audit requested from US Brand</p>
        <span class="toast-time">
            <span class="toast-time-dot"></span>
            <span id="toastTime">2 minutes ago</span>
        </span>
    </div>

    <button class="toast-close" id="toastClose" aria-label="Close notification">&times;</button>

</div>
